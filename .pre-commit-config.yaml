# Preserve third-party snapshots byte-for-byte; their local.patch is reviewed separately.
exclude: ^third_party/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-beta.5
    hooks:
      # File/module hooks honor the snapshot exclusion above. The repo-mod
      # hooks independently find every go.mod, including third-party modules.
      - id: go-imports
        args:
          - "-local"
          - "github.com/benbjohnson/litestream"
          - "-w"
      - id: go-vet-mod
      - id: go-staticcheck-mod
